version: '3'
services:

  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: jinesh
        uid: 1000
    image: laravel-app-umng
    container_name: laravel-app-umng
    # restart: unless-stopped
    restart: "no"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel

  # Nginx Service
  web:
    image: nginx:alpine
    container_name: laravel-web-umng
    # restart: unless-stopped
    restart: "no"
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:

      - laravel

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: mysql-db-umng
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: umng
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: umng
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  # Mailpit Service
  mailpit:
    image: axllent/mailpit
    container_name: mailpit-umng
    restart: "no"
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
    driver: local
